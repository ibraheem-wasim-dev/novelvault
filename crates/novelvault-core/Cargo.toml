[package]
name = "novelvault-core"
description = "NovelVault V1 — local-first folder index, version families and Inbox. No UI, no network."
version.workspace = true
edition.workspace = true

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
pdf-extract = { version = "0.7", optional = true }

[features]
default = ["pdf"]
pdf = ["pdf-extract"]

[dev-dependencies]
tempfile = "3"
