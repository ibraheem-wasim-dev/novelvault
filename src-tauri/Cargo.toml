[package]
name = "novelvault-desktop"
description = "NovelVault — local-first desktop novel vault"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
novelvault-core = { path = "../crates/novelvault-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0
